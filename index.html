
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Video Chat</title>

<style>
body {
  margin: 0;
  padding: 15px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h2 {
  color: #a78bfa;
}

video {
  width: 46%;
  height: 230px;
  background: black;
  border-radius: 12px;
  object-fit: cover;
}

button {
  padding: 12px;
  margin: 5px;
  border: none;
  border-radius: 9px;
  background: #8b5cf6;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

input {
  display: block;
  width: 95%;
  padding: 10px;
  margin: 8px auto;
  background: #202a3c;
  color: white;
  border: 1px solid #526079;
  border-radius: 8px;
}

#status {
  padding: 12px;
  background: #202a3c;
  border-radius: 10px;
}
</style>
</head>

<body>

<h2>🎥 Random Video Chat</h2>

<p id="status">Firebase සැකසුම කරන්න.</p>

<div>
  <video id="localVideo"
    autoplay playsinline muted></video>

  <video id="remoteVideo"
    autoplay playsinline></video>
</div>

<p>ඔයාගේ කැමරාව | අනෙක් පුද්ගලයා</p>

<h3>Firebase Settings</h3>

<input id="apiKey" placeholder="Firebase API Key">
<input id="authDomain" placeholder="authDomain">
<input id="databaseURL" placeholder="databaseURL">
<input id="projectId" placeholder="projectId">
<input id="appId" placeholder="appId">

<button id="saveBtn">Save & Connect</button>

<br>

<button id="startBtn">📹 Start / Match</button>
<button id="nextBtn" disabled>⏭ Next</button>
<button id="stopBtn" disabled>✖ Stop</button>

<br>

<button id="micBtn" disabled>🎙 Mic Off</button>
<button id="camBtn" disabled>📷 Camera Off</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
